- comment_id: C019
  section: 6 Discussion > 6.2.2 The competence was built by the individual
  anchor_text: "The second resource employees provided was the competence to use LLMs. When a new technology is introduced through an organizational deployment, the organization does not merely provide access to the tool. Rather, it also creates the conditions under which employees can become competent users through training, introduction and the support that surrounds a new system. In this sample, this competence-building function was largely performed by the individual. Therefore, LLM use became possible because some employees developed the necessary competence themselves. Individual learning was not just part of the adoption process. It actually substituted the organizational implementation function that would have been otherwise not present."
  anchor_context: "Opening paragraph of Section 6.2.2."
  dimension: redundancy
  change_type: rewrite
  comment_body: "The opening repeats the competence-substitution claim several times before reaching the evidence. Proposed wording: The second resource employees supplied was competence. Rather than receiving training and support through an organizational deployment, users developed the skills needed to use LLMs themselves; individual learning therefore substituted for a missing implementation function."
  replacement_text: "The second resource employees supplied was competence. Rather than receiving training and support through an organizational deployment, users developed the skills needed to use LLMs themselves; individual learning therefore substituted for a missing implementation function."
  target_location: null
  author: "Codex Academic Editor"
  initials: "CAE"

