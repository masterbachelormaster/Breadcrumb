- comment_id: C006
  section: 5 Findings > Quantitative Findings > Adoption Barriers Among Non-Users
  anchor_text: "The most frequently named barrier was a lack of training or guidelines (Fehlende Schulung/Guidelines), reported by 42.1% (n=16) of non-users. This was followed closely by doubts about the added value or output quality of LLMs (Kein Mehrwert/Qualitätszweifel, 39.5%, n=15) and the absence of official clearance or access (Keine Freigabe/Zugang, 36.8%, n=14). Information-security concerns (Informationssicherheitsbedenken) ranked fourth at 34.2% (n=13). An unclear legal or data-protection situation (Unklare Rechts-/Datenschutzlage) and a lack of integration into existing workflows (Fehlende Integration) were each named by 28.9% (n=11). The remaining barriers were reported less often: a prohibition through a service agreement (Verbot durch Dienstvereinbarung, 18.4%, n=7), other reasons (Sonstiges, 15.8%, n=6) and a lack of time to become familiar with the tool (Zeitmangel zur Einarbeitung, 13.2%, n=5)."
  anchor_context: "First prose paragraph after the non-user barriers table."
  dimension: redundancy
  change_type: cut
  comment_body: "Remove the entire paragraph through ‘Zeitmangel zur Einarbeitung, 13.2%, n=5).’ It restates every row and percentage in the table, while the following paragraph already provides the useful synthesis between organizational barriers and doubts about the tool itself."
  replacement_text: null
  target_location: null
  author: "Codex Academic Editor"
  initials: "CAE"

