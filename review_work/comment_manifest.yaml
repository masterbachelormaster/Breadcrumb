- comment_id: C012
  section: 6 Discussion > 6.2.1 Access to the tool was supplied by the individual
  anchor_text: "Therefore, the tool used for administrative work was in most cases not provided through a formal organizational deployment. Employees brought the non-approved tool into their work themselves. In most cases, therefore, the tool used for work-related tasks was a publicly available one that employees accessed themselves rather than one provided by their organization."
  anchor_context: "Final three sentences of the paragraph reporting 83.6% freely accessible tools and 13.8% organization-provided tools."
  dimension: redundancy
  change_type: rewrite
  comment_body: "Replace these three sentences with the proposed single sentence. All three draw the same inference from the tool-distribution figures, so the repetition delays the explanation of why Facilitating Conditions did not predict frequency. One synthesis sentence preserves the finding and moves the reader directly to the mechanism. Proposed wording: Thus, in most cases, employees accessed a publicly available tool themselves rather than receiving one through formal organizational deployment."
  replacement_text: "Thus, in most cases, employees accessed a publicly available tool themselves rather than receiving one through formal organizational deployment."
  target_location: null

- comment_id: C013
  section: 6 Discussion > 6.2.1 Access to the tool was supplied by the individual
  anchor_text: "The takeaway point is therefore not simply that many users preferred ChatGPT or other public tools. The more important point is that LLM access was decoupled from organizational provision."
  anchor_context: "Opening of the paragraph immediately after the paragraph beginning 'This finding helps to understand why Facilitating Conditions did not predict usage frequency'."
  dimension: redundancy
  change_type: merge
  comment_body: "Merge this paragraph into the preceding paragraph beginning 'This finding helps to understand why Facilitating Conditions did not predict usage frequency in the regression.' Retain the preceding paragraph's description of what the Facilitating Conditions items measured and this paragraph's theoretical point that public access weakened the construct's expected gatekeeping role. State the mechanism once: public tools removed employees' dependence on procurement and formal provision. Delete the repeated claims that support only exists after organizational introduction and that employees could access the tool without institutional clearance."
  replacement_text: null
  target_location: "The immediately preceding paragraph beginning 'This finding helps to understand why Facilitating Conditions did not predict usage frequency in the regression.'"

- comment_id: C014
  section: 6 Discussion > 6.2.2 The competence was built by the individual
  anchor_text: "The second resource employees provided was the competence to use LLMs. When a new technology is introduced through an organizational deployment, the organization does not merely provide access to the tool."
  anchor_context: "Opening paragraph of Section 6.2.2; the paragraph continues by restating that individuals performed the competence-building function."
  dimension: redundancy
  change_type: rewrite
  comment_body: "Replace the entire opening paragraph of this subsection with the proposed wording. The current paragraph makes the same substitution claim several times before reaching the evidence. The shorter version preserves the contrast with formal deployment, states the analytical function of individual learning once, and lets the interview evidence begin sooner. Proposed wording: The second resource employees supplied was competence. Rather than receiving training and support through an organizational deployment, users developed the skills needed to use LLMs themselves; individual learning therefore substituted for a missing implementation function."
  replacement_text: "The second resource employees supplied was competence. Rather than receiving training and support through an organizational deployment, users developed the skills needed to use LLMs themselves; individual learning therefore substituted for a missing implementation function."
  target_location: null

- comment_id: C015
  section: 6 Discussion > 6.2.4 Appropriate use was decided task by task
  anchor_text: "Indeed, the interviews revealed several distinct dimensions along which users exercised this task-level judgment. One was efficiency. Some users assessed whether using an LLM would actually save time or whether prompting, correcting and checking the output would take longer than doing the task themselves."
  anchor_context: "First analytical paragraph after the supplementary survey evidence in Section 6.2.4; the paragraph continues to repeat the effort-versus-benefit comparison."
  dimension: redundancy
  change_type: rewrite
  comment_body: "Replace this entire paragraph with the proposed two sentences. The current version repeats the same effort-versus-benefit point in five formulations. The revision keeps the analytical dimension and its implication—that users sometimes reject LLM support—without crowding out the next two distinct dimensions of work phase and data sensitivity. Proposed wording: One dimension was efficiency: users weighed any time saved against the effort required to prompt, check, and correct an output. They therefore rejected LLM support for tasks where that effort outweighed the benefit."
  replacement_text: "One dimension was efficiency: users weighed any time saved against the effort required to prompt, check, and correct an output. They therefore rejected LLM support for tasks where that effort outweighed the benefit."
  target_location: null

- comment_id: C016
  section: 6 Discussion > 6.2.4 Appropriate use was decided task by task
  anchor_text: "Performance Expectancy is especially relevant in this context. The regression showed that Performance Expectancy was the second significant predictor of usage frequency."
  anchor_context: "Penultimate analytical paragraph of Section 6.2.4, after the three dimensions of task-level judgment."
  dimension: redundancy
  change_type: rewrite
  comment_body: "Replace this entire paragraph with the proposed wording. The paragraph repeats three times that perceived usefulness was task-specific rather than a general belief. The revision preserves the mixed-methods interpretation and its cautious phrasing while stating the quantitative link and qualitative mechanism once. Proposed wording: Performance Expectancy, the second significant predictor of usage frequency, can therefore be understood as task-specific rather than general perceived usefulness. The interviews suggest that users developed this perception by learning where LLMs saved time or improved drafts—and where they did not."
  replacement_text: "Performance Expectancy, the second significant predictor of usage frequency, can therefore be understood as task-specific rather than general perceived usefulness. The interviews suggest that users developed this perception by learning where LLMs saved time or improved drafts—and where they did not."
  target_location: null

